name: Deploy
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 打印环境变量方便调试
        run: |
          echo "密钥: ${{ secrets.OPENAI_KEY }}"
          echo "数据库密码: ${{ secrets.DB_PASS }}"
          cat .env
      - name: 部署到服务器
        run: |
          sshpass -p "root123" ssh root@0.0.0.0 "cd /app && git pull && pm2 restart all"